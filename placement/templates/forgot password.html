<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Novasphere</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #512da8;
            --primary-light: #5c6bc0;
            --bg-main: #f5f7ff;
            --card-bg: #ffffff;
            --text-primary: #333333;
            --text-secondary: #666666;
            --shadow: rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, #f0f4ff 0%, #e2e8f0 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .recovery-card {
            background: var(--card-bg);
            border-radius: 24px;
            box-shadow: 0 15px 35px var(--shadow);
            padding: 2.5rem;
            width: 100%;
            max-width: 450px;
            border: 1px solid rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
        }

        .recovery-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .icon-box {
            width: 70px;
            height: 70px;
            background: rgba(81, 45, 168, 0.1);
            color: var(--primary);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin: 0 auto 1.5rem;
        }

        .recovery-title {
            font-weight: 800;
            color: #1e293b;
            margin-bottom: 0.5rem;
        }

        .recovery-subtitle {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .form-label {
            font-weight: 600;
            font-size: 0.9rem;
            color: #475569;
            margin-bottom: 0.5rem;
        }

        .form-control {
            border-radius: 12px;
            padding: 0.8rem 1.2rem;
            border: 1.5px solid #e2e8f0;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(81, 45, 168, 0.1);
        }

        .btn-recovery {
            background: linear-gradient(135deg, #512da8 0%, #311b92 100%);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 0.9rem;
            font-weight: 700;
            width: 100%;
            margin-top: 1rem;
            transition: all 0.3s ease;
        }

        .btn-recovery:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(81, 45, 168, 0.3);
            color: white;
        }

        .back-link {
            text-align: center;
            margin-top: 1.5rem;
        }

        .back-link a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .back-link a:hover {
            color: var(--primary-light);
            text-decoration: underline;
        }

        .alert {
            border-radius: 12px;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
            border: none;
        }
    </style>
</head>
<body>
    <div class="recovery-card">
        <div class="recovery-header">
            <div class="icon-box">
                <i class="bi bi-shield-lock-fill"></i>
            </div>
            <h3 class="recovery-title">Forgot Password?</h3>
            <p class="recovery-subtitle">Enter your email address to receive a recovery link.</p>
        </div>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-danger d-flex align-items-center gap-2">
                        <i class="bi bi-exclamation-triangle-fill"></i>
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="{{ url_for('forgot_password') }}" method="post">
            <div class="mb-3">
                <label for="email" class="form-label">Email Address</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 rounded-start-3">
                        <i class="bi bi-envelope text-muted"></i>
                    </span>
                    <input type="email" class="form-control border-start-0 rounded-end-3" id="email" name="email" placeholder="name@example.com" required>
                </div>
            </div>
            <button type="submit" class="btn btn-recovery">
                <i class="bi bi-send-fill me-2"></i> Send Recovery Link
            </button>
        </form>

        <div class="back-link">
            <a href="{{ url_for('loginpage') }}">
                <i class="bi bi-arrow-left me-1"></i> Back to Login
            </a>
        </div>
    </div>
</body>
</html>
