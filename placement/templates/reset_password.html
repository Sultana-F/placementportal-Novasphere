<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Novasphere</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #512da8;
            --primary-light: #5c6bc0;
            --bg-main: #f5f7ff;
            --card-bg: #ffffff;
            --text-primary: #333333;
            --text-secondary: #666666;
            --shadow: rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, #f0f4ff 0%, #e2e8f0 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .recovery-card {
            background: var(--card-bg);
            border-radius: 24px;
            box-shadow: 0 15px 35px var(--shadow);
            padding: 2.5rem;
            width: 100%;
            max-width: 450px;
            border: 1px solid rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
        }

        .recovery-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .icon-box {
            width: 70px;
            height: 70px;
            background: rgba(16, 185, 129, 0.1);
            color: #10b981;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin: 0 auto 1.5rem;
        }

        .recovery-title {
            font-weight: 800;
            color: #1e293b;
            margin-bottom: 0.5rem;
        }

        .recovery-subtitle {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .form-label {
            font-weight: 600;
            font-size: 0.9rem;
            color: #475569;
            margin-bottom: 0.5rem;
        }

        .form-control {
            border-radius: 12px;
            padding: 0.8rem 1.2rem;
            border: 1.5px solid #e2e8f0;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(81, 45, 168, 0.1);
        }

        .btn-recovery {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 0.9rem;
            font-weight: 700;
            width: 100%;
            margin-top: 1rem;
            transition: all 0.3s ease;
        }

        .btn-recovery:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.3);
            color: white;
        }

        .alert {
            border-radius: 12px;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
            border: none;
        }
    </style>
</head>
<body>
    <div class="recovery-card">
        <div class="recovery-header">
            <div class="icon-box">
                <i class="bi bi-key-fill"></i>
            </div>
            <h3 class="recovery-title">New Password</h3>
            <p class="recovery-subtitle">Please enter your new secure password below.</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} d-flex align-items-center gap-2">
                        <i class="bi bi-info-circle-fill"></i>
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('reset_password', token=token) }}">
            <div class="mb-3">
                <label for="newpassword" class="form-label">New Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 rounded-start-3">
                        <i class="bi bi-lock text-muted"></i>
                    </span>
                    <input type="password" class="form-control border-start-0 rounded-end-3" id="newpassword" name="newpassword" placeholder="Min. 8 characters" required>
                </div>
            </div>
            <button type="submit" class="btn btn-recovery">
                <i class="bi bi-check-circle-fill me-2"></i> Update Password
            </button>
        </form>
    </div>
</body>
</html>
