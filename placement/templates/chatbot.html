<!-- Placement Chatbot UI -->
<div id="chatbot-container">
    <div id="chatbot-bubble">
        <i class="bi bi-chat-dots-fill"></i>
    </div>

    <div id="chatbot-window" class="d-none">
        <div id="chatbot-header">
            <div class="d-flex align-items-center gap-2">
                <div class="chatbot-avatar">
                    <i class="bi bi-robot"></i>
                </div>
                <div>
                    <h6 class="mb-0 fw-bold">NovaSphere Assistant</h6>
                    <small class="opacity-75">Online | AI Powered</small>
                </div>
            </div>
            <button id="chatbot-close" class="btn-close btn-close-white"></button>
        </div>

        <div id="chatbot-messages">
            <div class="message assistant">
                Hello! I'm your Placement Assistant. How can I help you today?
            </div>
        </div>

        <div id="chatbot-input-container">
            <input type="text" id="chatbot-input" placeholder="Type your message..." autocomplete="off">
            <button id="chatbot-send">
                <i class="bi bi-send-fill"></i>
            </button>
        </div>
    </div>
</div>

<style>
    #chatbot-container {
        position: fixed;
        bottom: 30px;
        right: 30px;
        z-index: 9999;
        font-family: 'Inter', sans-serif;
    }

    #chatbot-bubble {
        width: 60px;
        height: 60px;
        background: linear-gradient(135deg, #512da8 0%, #6366f1 100%);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 1.8rem;
        cursor: pointer;
        box-shadow: 0 10px 25px rgba(81, 45, 168, 0.4);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    #chatbot-bubble:hover {
        transform: scale(1.1) rotate(5deg);
        box-shadow: 0 15px 30px rgba(81, 45, 168, 0.5);
    }

    #chatbot-window {
        width: 350px;
        height: 500px;
        background: white;
        border-radius: 20px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        animation: slideIn 0.4s ease-out;
    }

    @keyframes slideIn {
        from {
            transform: translateY(100px);
            opacity: 0;
        }

        to {
            transform: translateY(0);
            opacity: 1;
        }
    }

    #chatbot-header {
        background: linear-gradient(135deg, #512da8 0%, #6366f1 100%);
        color: white;
        padding: 1.25rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .chatbot-avatar {
        width: 40px;
        height: 40px;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.2rem;
    }

    #chatbot-messages {
        flex: 1;
        padding: 1.25rem;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 1rem;
        background: #f8fafc;
    }

    .message {
        max-width: 80%;
        padding: 0.75rem 1rem;
        border-radius: 15px;
        font-size: 0.9rem;
        line-height: 1.4;
    }

    .message.assistant {
        align-self: flex-start;
        background: white;
        color: #1e293b;
        border-bottom-left-radius: 2px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
    }

    .message.user {
        align-self: flex-end;
        background: #512da8;
        color: white;
        border-bottom-right-radius: 2px;
    }

    #chatbot-input-container {
        padding: 1rem;
        background: white;
        border-top: 1px solid #e2e8f0;
        display: flex;
        gap: 0.5rem;
    }

    #chatbot-input {
        flex: 1;
        border: 1px solid #e2e8f0;
        border-radius: 10px;
        padding: 0.6rem 1rem;
        outline: none;
        font-size: 0.9rem;
        transition: border-color 0.2s;
    }

    #chatbot-input:focus {
        border-color: #512da8;
    }

    #chatbot-send {
        background: #512da8;
        color: white;
        border: none;
        width: 40px;
        height: 40px;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: background 0.2s;
    }

    #chatbot-send:hover {
        background: #311b92;
    }

    .typing-indicator {
        display: flex;
        gap: 4px;
        padding: 10px;
    }

    .typing-dot {
        width: 6px;
        height: 6px;
        background: #cbd5e1;
        border-radius: 50%;
        animation: bounce 1.4s infinite ease-in-out;
    }

    .typing-dot:nth-child(1) {
        animation-delay: -0.32s;
    }

    .typing-dot:nth-child(2) {
        animation-delay: -0.16s;
    }

    @keyframes bounce {

        0%,
        80%,
        100% {
            transform: scale(0);
        }

        40% {
            transform: scale(1);
        }
    }
</style>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const bubble = document.getElementById('chatbot-bubble');
        const chatWindow = document.getElementById('chatbot-window');
        const close = document.getElementById('chatbot-close');
        const input = document.getElementById('chatbot-input');
        const send = document.getElementById('chatbot-send');
        const messages = document.getElementById('chatbot-messages');

        bubble.addEventListener('click', () => {
            chatWindow.classList.remove('d-none');
            bubble.classList.add('d-none');
            input.focus();
        });

        close.addEventListener('click', () => {
            chatWindow.classList.add('d-none');
            bubble.classList.remove('d-none');
        });

        function addMessage(text, sender) {
            const msg = document.createElement('div');
            msg.className = `message ${sender}`;
            msg.innerText = text;
            messages.appendChild(msg);
            messages.scrollTop = messages.scrollHeight;
        }

        function showTyping() {
            const typing = document.createElement('div');
            typing.id = 'typing-indicator';
            typing.className = 'message assistant typing-indicator';
            typing.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
            messages.appendChild(typing);
            messages.scrollTop = messages.scrollHeight;
            return typing;
        }

        async function handleSend() {
            const text = input.value.trim();
            if (!text) return;

            addMessage(text, 'user');
            input.value = '';

            const typing = showTyping();

            setTimeout(() => {
                let reply = "I am a simple placement assistant. I can help you with placement drives, resume building, and general queries.";
                const lowerText = text.toLowerCase();

                if (lowerText.includes('hello') || lowerText.includes('hi')) {
                    reply = "Hello there! How can I assist you with your placements today?";
                } else if (lowerText.includes('resume') || lowerText.includes('cv')) {
                    reply = "You can build an ATS-friendly resume using our Resume Builder feature. Navigate to your dashboard to get started!";
                } else if (lowerText.includes('drive') || lowerText.includes('company') || lowerText.includes('job') || lowerText.includes('placement')) {
                    reply = "You can view all upcoming and active placement drives in your dashboard. Make sure to check the eligibility criteria and apply before the deadline!";
                } else if (lowerText.includes('contact') || lowerText.includes('tpo') || lowerText.includes('help')) {
                    reply = "If you need specific help or have issues with your profile, please contact the Training & Placement Officer (TPO) office.";
                } else if (lowerText.includes('thank')) {
                    reply = "You're welcome! Best of luck with your career journey.";
                } else if (lowerText.includes('status') || lowerText.includes('result')) {
                    reply = "Placement results and application statuses are updated by the TPO on the Notice Board and your applications list.";
                }

                messages.removeChild(typing);
                addMessage(reply, 'assistant');
            }, 1000);
        }

        send.addEventListener('click', handleSend);
        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSend();
        });
    });
</script>
